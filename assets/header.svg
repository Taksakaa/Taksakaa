<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="360" rx="24" fill="url(#glow)"/>
  <rect width="1400" height="360" rx="24" fill="url(#grid)"/>

  <!-- ===== headline (center, clear zone) ===== -->
  <text x="700" y="182" text-anchor="middle" font-weight="800" font-size="64" letter-spacing="-1">
    <tspan fill="#ffffff">Building with </tspan><tspan fill="#ffffff" font-style="italic">logic,</tspan>
  </text>
