  <g transform="translate(500 24) rotate(-2)"><rect width="304" height="52" rx="14" fill="#242424" stroke="#3a3a3a"/><text x="22" y="33" fill="#e8e8e8" font-size="22" font-weight="600">✨ Adobe Creative Suite</text></g>
